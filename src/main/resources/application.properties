spring.application.name=storage-manager-communications

# Server
server.port=8083

# Datasource (overridden per profile)
spring.datasource.url=jdbc:postgresql://localhost:5432/storage_manager_communications
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api/v1/docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT role claim used by the authentication converter
app.security.jwt.role-claim=custom:role

# Messaging starter (storage-manager-messaging) — base scope.
# Communications adopts BOTH starter halves generically: inbox on (idempotent receive +
# no-op dedupe) and outbox on (transactional append + scheduled publish to events ingest).
storagemanager.messaging.inbox.enabled=true
storagemanager.messaging.outbox.enabled=true
# Enrichment persists scope_0/scope_1/correlation_id/headers on the enriched tables.
storagemanager.messaging.enrichment.enabled=true
# Ordered scope-fields: index 0 -> scope_0, index 1 -> scope_1
storagemanager.messaging.scope-fields[0]=organization_id
storagemanager.messaging.scope-fields[1]=facility_id
# Publisher drain tuning
storagemanager.messaging.outbox.poll-interval-ms=1000
storagemanager.messaging.outbox.batch-size=100
# Parked (dead-lettered) after this many attempts
storagemanager.messaging.max-attempts=10
# Retry backoff
storagemanager.messaging.backoff.base=1s
storagemanager.messaging.backoff.max=5m
storagemanager.messaging.backoff.multiplier=2
# Events service transport (base-url default covers local via the EVENTS_BASE_URL default)
storagemanager.messaging.events.base-url=${EVENTS_BASE_URL:http://localhost:8081}
storagemanager.messaging.events.connect-timeout=2s
storagemanager.messaging.events.read-timeout=5s
# Service-to-service auth: off in local Phase 0 (no service-identity token attached on outbound).
storagemanager.messaging.events.auth.enabled=false

# Ingest scope (Ingest_Scope) -> SCOPE_events/ingest authority classifies a Trusted_Ingest_Caller.
app.security.jwt.ingest-scope=events/ingest

# storage-manager-api read transport (live LeadReadPort). The HttpLeadReadPort reads a single lead
# from the api (GET /api/v1/leads/{id}) to resolve org/facility/contacts/properties when processing
# a SendCommunication action. The live adapter is active only in the non-local runtime profile; the
# in-memory StubLeadReadPort stays active under local/test/default. Key shape mirrors the
# storagemanager.messaging.events.* group, pointing at the api (api runs on server.port 8080).
#   - base-url: api base URL (env-overridable via API_BASE_URL).
#   - connect-timeout/read-timeout: applied to the outbound RestClient so a hung api never blocks
#     the processing thread indefinitely.
#   - auth.enabled: service-to-service bearer-token toggle. Off in local Phase 0 (no token attached);
#     when true, a leads/read-scoped service token is attached via the ApiAuthTokenProvider seam
#     (token production is platform-owned; the api-side trusted-caller read path is assumed).
storagemanager.api.base-url=${API_BASE_URL:http://localhost:8080}
storagemanager.api.connect-timeout=2s
storagemanager.api.read-timeout=5s
storagemanager.api.auth.enabled=false
