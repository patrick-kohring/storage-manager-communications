# Local JWT Issuer Configuration
# The communications service validates JWTs against the storage-manager-api local issuer
# (the same key/JWKS the api and events services trust in dev), so authenticated and
# service-to-service paths can be exercised locally without AWS Cognito.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/api/v1/local
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/api/v1/local/.well-known/jwks.json

# Local Postgres (Homebrew) uses the OS user as the role with no password, so override the
# default postgres/postgres credentials from application.properties for local runs.
spring.datasource.url=jdbc:postgresql://localhost:5432/storage_manager_communications
spring.datasource.username=patrick-kohring
spring.datasource.password=
