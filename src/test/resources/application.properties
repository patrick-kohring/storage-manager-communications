# Test datasource: in-memory H2 in PostgreSQL compatibility mode.
spring.datasource.url=jdbc:h2:mem:comm_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Let Hibernate create the schema for @DataJpaTest / @SpringBootTest slices; the real DDL is
# validated independently by the Flyway migration smoke test against H2.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Flyway is validated by a dedicated smoke test; disable it for Spring-context slices so the
# PostgreSQL-only partial index DDL is not applied against H2 by the auto-migration.
spring.flyway.enabled=false

# Local-style JWT issuer config so the resource server can start in @SpringBootTest; tests use
# spring-security-test mock tokens rather than a live issuer.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/api/v1/local
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/api/v1/local/.well-known/jwks.json

app.security.jwt.role-claim=custom:role
